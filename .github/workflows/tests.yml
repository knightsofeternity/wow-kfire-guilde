name: tests
on:
  push:
  pull_request:
jobs:
  bancs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: lua5.1 test/guilde.lua | tee /tmp/guilde.txt && grep -q 'tout est vert' /tmp/guilde.txt
